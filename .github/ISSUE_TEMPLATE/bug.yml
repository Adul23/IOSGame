name: Баг
description: Сообщите об ошибке игры
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Браузер, ОС, устройство; file или HTTP
    validations:
      required: true
