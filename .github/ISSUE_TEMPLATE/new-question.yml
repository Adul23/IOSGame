name: Новый вопрос
description: Предложите вопрос для викторины
title: "[Question] "
labels: [content]
body:
  - type: textarea
    id: question
    attributes:
      label: Вопрос в формате JSON
      description: id, topic, difficulty, question, answers, correct, explanation, source
      render: json
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Ссылка на первоисточник
    validations:
      required: true
